app = "akare-hesap" # Gerekirse Fly.io'daki gerçek app adınla değiştir
primary_region = "ams" # Uygulamanın çalışacağı bölge (örnek: ams, fra, iad)

[build]
  dockerfile = "Dockerfile"

[env]
  # JSON verilerinin tutulacağı kalıcı klasör
  DATA_DIR = "/data"
  # İç servis portu (Docker'da gunicorn 8080'de dinleyecek)
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  # Daha sonra fly volumes create data --region ams komutuyla oluşturacağın volume ismi
  source = "data"
  destination = "/data"
